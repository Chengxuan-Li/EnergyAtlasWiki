<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Incident radiation components</title>
  <desc id="desc">Diagram showing EPW weather, solar geometry, sunlit fraction, sky and horizon visibility feeding direct, diffuse, ground reflected, and final incident radiation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:16px Arial,sans-serif;fill:#0f172a}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;rx:8}
      .calc{fill:#ecfeff;stroke:#0891b2;stroke-width:1.5;rx:8}
      .out{fill:#fef3c7;stroke:#d97706;stroke-width:1.5;rx:8}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <rect x="40" y="45" width="210" height="86" class="box"/>
  <text x="60" y="75" class="label">EPW weather</text>
  <text x="60" y="100" class="small">DNI, DHI, date/time</text>
  <rect x="40" y="170" width="210" height="86" class="box"/>
  <text x="60" y="200" class="label">Solar geometry</text>
  <text x="60" y="225" class="small">elevation, azimuth, zenith</text>
  <rect x="40" y="295" width="210" height="96" class="box"/>
  <text x="60" y="325" class="label">Shading result</text>
  <text x="60" y="350" class="small">sunlit fraction, SVF, HVF</text>
  <text x="60" y="370" class="small">surface normal</text>
  <rect x="340" y="70" width="260" height="78" class="calc"/>
  <text x="360" y="101" class="label">Direct beam</text>
  <text x="360" y="126" class="small">max(0, DNI * cos(AOI) * sunlit)</text>
  <rect x="340" y="210" width="260" height="110" class="calc"/>
  <text x="360" y="241" class="label">Perez diffuse</text>
  <text x="360" y="266" class="small">circumsolar * sunlit</text>
  <text x="360" y="286" class="small">dome * SVF</text>
  <text x="360" y="306" class="small">horizon * HVF</text>
  <rect x="340" y="375" width="260" height="78" class="calc"/>
  <text x="360" y="406" class="label">Ground reflected</text>
  <text x="360" y="431" class="small">(DNI*cosZ + DHI) * rho * groundVF</text>
  <rect x="715" y="210" width="220" height="116" class="out"/>
  <text x="735" y="244" class="label">Incident solar</text>
  <text x="735" y="270" class="small">(direct + diffuse + ground)</text>
  <text x="735" y="292" class="small">/ 1000</text>
  <text x="735" y="314" class="small">kWh/m2 per hour record</text>
  <path class="arrow" d="M250 88 C300 88 300 109 340 109"/>
  <path class="arrow" d="M250 213 C300 213 300 109 340 109"/>
  <path class="arrow" d="M250 343 C305 343 305 109 340 109"/>
  <path class="arrow" d="M250 88 C305 88 305 265 340 265"/>
  <path class="arrow" d="M250 213 C305 213 305 265 340 265"/>
  <path class="arrow" d="M250 343 C305 343 305 265 340 265"/>
  <path class="arrow" d="M250 88 C305 88 305 414 340 414"/>
  <path class="arrow" d="M250 213 C305 213 305 414 340 414"/>
  <path class="arrow" d="M600 109 C665 109 665 246 715 246"/>
  <path class="arrow" d="M600 265 L715 265"/>
  <path class="arrow" d="M600 414 C665 414 665 292 715 292"/>
</svg>
