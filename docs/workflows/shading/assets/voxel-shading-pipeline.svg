<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Voxel shading API pipeline</title>
  <desc id="desc">Diagram showing voxelize, generate sensors, calculate shading, preview, job polling, and result outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:16px Arial,sans-serif;fill:#0f172a}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .in{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;rx:8}
      .api{fill:#ecfeff;stroke:#0891b2;stroke-width:1.5;rx:8}
      .out{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.5;rx:8}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1040" height="560" fill="#ffffff"/>
  <rect x="35" y="70" width="190" height="92" class="in"/>
  <text x="55" y="100" class="label">Inputs</text>
  <text x="55" y="124" class="small">LAS/LAZ + footprints</text>
  <text x="55" y="146" class="small">settings + tile slicer</text>
  <rect x="285" y="55" width="210" height="122" class="api"/>
  <text x="305" y="86" class="label">0. voxelize</text>
  <text x="305" y="112" class="small">/api/voxelShading/voxelize</text>
  <text x="305" y="136" class="small">point cloud -> sparse voxels</text>
  <text x="305" y="158" class="small">drape footprints</text>
  <rect x="555" y="55" width="210" height="122" class="api"/>
  <text x="575" y="86" class="label">1. generateSensors</text>
  <text x="575" y="112" class="small">roof + facade sensor records</text>
  <text x="575" y="136" class="small">position, normal, area</text>
  <text x="575" y="158" class="small">*_sensors.msgpack</text>
  <rect x="825" y="55" width="185" height="122" class="api"/>
  <text x="845" y="86" class="label">2. calculate</text>
  <text x="845" y="112" class="small">sun rays + SVF/HVF</text>
  <text x="845" y="136" class="small">*_sensorshading</text>
  <text x="845" y="158" class="small">msgpack</text>
  <path class="arrow" d="M225 116 L285 116"/>
  <path class="arrow" d="M495 116 L555 116"/>
  <path class="arrow" d="M765 116 L825 116"/>
  <rect x="285" y="250" width="210" height="78" class="out"/>
  <text x="305" y="280" class="label">VoxelizationCache</text>
  <text x="305" y="305" class="small">*_voxelgrid.msgpack</text>
  <rect x="555" y="250" width="210" height="78" class="out"/>
  <text x="575" y="280" class="label">Sensor directory</text>
  <text x="575" y="305" class="small">*_sensors.msgpack</text>
  <rect x="825" y="250" width="185" height="78" class="out"/>
  <text x="845" y="280" class="label">Shading directory</text>
  <text x="845" y="305" class="small">sunlit, SVF, HVF</text>
  <path class="arrow" d="M390 177 L390 250"/>
  <path class="arrow" d="M660 177 L660 250"/>
  <path class="arrow" d="M917 177 L917 250"/>
  <rect x="125" y="390" width="255" height="88" class="in"/>
  <text x="145" y="420" class="label">Job polling</text>
  <text x="145" y="446" class="small">GET /job/{jobId}</text>
  <text x="145" y="466" class="small">GET /result/{jobId}</text>
  <rect x="450" y="390" width="255" height="88" class="in"/>
  <text x="470" y="420" class="label">Previews</text>
  <text x="470" y="446" class="small">voxels, sensors, shading</text>
  <text x="470" y="466" class="small">limited render payloads</text>
  <rect x="775" y="390" width="220" height="88" class="in"/>
  <text x="795" y="420" class="label">Python connector</text>
  <text x="795" y="446" class="small">voxelize_and_wait</text>
  <text x="795" y="466" class="small">calculate_and_wait</text>
  <path class="dash" d="M390 328 C360 370 320 390 252 390"/>
  <path class="dash" d="M660 328 C635 370 610 390 578 390"/>
  <path class="dash" d="M917 328 C915 365 875 390 885 390"/>
</svg>
