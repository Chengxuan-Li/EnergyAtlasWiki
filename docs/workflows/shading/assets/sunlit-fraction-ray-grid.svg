<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sunlit fraction ray grid</title>
  <desc id="desc">Diagram showing representative days, sub-hour sun vectors, ray marching from sensors, and area-weighted group aggregation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .label{font:16px Arial,sans-serif;fill:#0f172a}
      .small{font:13px Arial,sans-serif;fill:#334155}
      .box{fill:#f8fafc;stroke:#64748b;stroke-width:1.5;rx:8}
      .grid{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5;rx:8}
      .sun{fill:#fde68a;stroke:#d97706;stroke-width:2}
      .arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .ray{stroke:#f59e0b;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .blocked{stroke:#dc2626;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="35" y="50" width="250" height="120" class="grid"/>
  <text x="55" y="82" class="label">Sun direction matrix</text>
  <text x="55" y="108" class="small">rows: 24 * TimeStep</text>
  <text x="55" y="130" class="small">cols: ceil(365 / CalcUpdateFreq)</text>
  <text x="55" y="152" class="small">SUN3 averages, SUN4 vectors</text>
  <circle cx="430" cy="105" r="34" class="sun"/>
  <text x="407" y="111" class="label">sun</text>
  <rect x="640" y="55" width="250" height="105" class="box"/>
  <text x="660" y="85" class="label">Per sensor</text>
  <text x="660" y="110" class="small">skip if sun behind surface</text>
  <text x="660" y="132" class="small">ray-march if facing sun</text>
  <path class="arrow" d="M285 110 L395 110"/>
  <path class="arrow" d="M465 110 L640 110"/>
  <rect x="190" y="315" width="610" height="58" fill="#e5e7eb" stroke="#475569"/>
  <text x="420" y="350" class="label">voxelized context</text>
  <circle cx="390" cy="280" r="7" fill="#0f172a"/>
  <line x1="390" y1="280" x2="390" y2="220" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="238" class="small">normal</text>
  <circle cx="560" cy="280" r="7" fill="#0f172a"/>
  <line x1="560" y1="280" x2="625" y2="225" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <path class="ray" d="M390 280 L555 165"/>
  <path class="blocked" d="M560 280 L680 315"/>
  <rect x="665" y="270" width="48" height="45" fill="#94a3b8" stroke="#475569"/>
  <text x="300" y="410" class="small">no hit -> true</text>
  <text x="610" y="410" class="small">hit -> false</text>
  <rect x="55" y="430" width="310" height="75" class="box"/>
  <text x="75" y="459" class="label">Area-weight group</text>
  <text x="75" y="485" class="small">sum(true * AreaSQM) / sum(AreaSQM)</text>
  <rect x="595" y="430" width="310" height="75" class="box"/>
  <text x="615" y="459" class="label">SunlitFraction</text>
  <text x="615" y="485" class="small">representative days, hourly if summarized</text>
  <path class="arrow" d="M470 380 C430 430 390 455 365 460"/>
  <path class="arrow" d="M365 468 L595 468"/>
</svg>
